# --- Console en UART ---
CONFIG_SERIAL=y
CONFIG_UART_CONSOLE=y
CONFIG_CONSOLE=y
CONFIG_PRINTK=y
CONFIG_EARLY_CONSOLE=y

# --- Float support voor printk ---
CONFIG_CBPRINTF_FP_SUPPORT=y
CONFIG_NEWLIB_LIBC=y
CONFIG_NEWLIB_LIBC_FLOAT_PRINTF=y

# --- Vergroot console buffers (tegen message drops) ---
CONFIG_PRINTK_BUFFER_SIZE=4096
CONFIG_LOG_BUFFER_SIZE=4096

# --- UART drivers ---
CONFIG_UART_INTERRUPT_DRIVEN=y
CONFIG_UART_USE_RUNTIME_CONFIGURE=y
CONFIG_UART_STM32=y

# --- I2C en BME280 sensor ---
CONFIG_I2C=y
CONFIG_SENSOR=y
CONFIG_BME280=y

# --- GPIO ---
CONFIG_GPIO=y

# --- Threads / stack ---
CONFIG_MAIN_THREAD_PRIORITY=7
CONFIG_MAIN_STACK_SIZE=4096

# --- Logging (optioneel, voor extra debug) ---
CONFIG_LOG=y
CONFIG_LOG_DEFAULT_LEVEL=3