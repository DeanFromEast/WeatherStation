# --- Console en UART ---
CONFIG_SERIAL=y
CONFIG_UART_CONSOLE=y
CONFIG_UART_INTERRUPT_DRIVEN=y
CONFIG_UART_LINE_CTRL=y
CONFIG_UART_USE_RUNTIME_CONFIGURE=y
CONFIG_UART_STM32=y     

# --- Sensoren ---
CONFIG_I2C=y
CONFIG_SENSOR=y
CONFIG_BME280=ys
CONFIG_SENSOR_ASYNC_API=y

# --- GPIO ---
CONFIG_GPIO=y

# --- Threads ---
CONFIG_MAIN_THREAD_PRIORITY=0
CONFIG_MAIN_STACK_SIZE=2048
